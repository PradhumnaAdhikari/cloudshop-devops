services:

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: cloudshop:1.1
    ports:
      - "8082:80"

  backend:
    image: nginx:1.31.3

  database:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: cloudshoproot
      MYSQL_DATABASE: cloudshop
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
