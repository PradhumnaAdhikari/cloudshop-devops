name: CloudShop Docker CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t ghcr.io/${{ github.repository_owner }}/cloudshop-devops:ci .

      - name: Push Docker image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/cloudshop-devops:ci
